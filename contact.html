<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — Maribel Mlali</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="site-header">
    <div class="wordmark"><span class="dot"></span> Maribel's Website</div>
    <nav class="site-nav">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Me</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
    </nav>
  </header>

  <section class="hero" style="padding-bottom: 1rem;">
    <span class="pill-label">Let's talk</span>
    <h1>Get in touch</h1>
  </section>

  <section class="contact-wrap reveal">
    <div class="contact-info">
      <h2>Reach me</h2>
      <dl class="attr-list">
        <div class="attr-row">
          <dt>email</dt>
          <dd>maribelmlali9@gmail.com</dd>
        </div>
        <div class="attr-row">
          <dt>phone</dt>
          <dd>0967-641-9582</dd>
        </div>
        <div class="attr-row">
          <dt>location</dt>
          <dd>T'boli, South Cotabato</dd>
        </div>
      </dl>
    </div>

    <form class="contact-form" action="https://formspree.io/f/xvzvvdjr
" method="POST">
      <div class="field">
        <label for="name">name</label>
        <input type="text" id="name" name="name" placeholder="Your full name" required />
      </div>
      <div class="field">
        <label for="email">email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required />
      </div>
      <div class="field">
        <label for="message">message</label>
        <textarea id="message" name="message" placeholder="Write your message here..." required></textarea>
      </div>
      <button type="submit" class="btn-light">Send Message</button>
    </form>
  </section>

  <footer class="site-footer">
    <span class="dot">●</span> 2026 Maribel Mlali — built for PT101, Cloud Deployment Project
  </footer>

  <script src="js/script.js"></script>

</body>
</html>
